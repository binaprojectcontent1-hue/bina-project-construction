  <!-- Architectural Graduation Marks (Gold & White) -->
  <!-- Tick 1 (Major Gold) -->
  <line x1="6.5" y1="6.5" x2="9" y2="4" stroke="#E5A93C" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Tick 2 (Minor White) -->
  <line x1="8.5" y1="8.5" x2="10.5" y2="6.5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Tick 3 (Medium White) -->
  <line x1="10.5" y1="10.5" x2="13" y2="8" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <!-- Tick 4 (Minor White) -->
  <line x1="12.5" y1="12.5" x2="14.5" y2="10.5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Tick 5 (Major Gold - Center Milestone) -->
  <line x1="14.5" y1="14.5" x2="17.5" y2="11.5" stroke="#E5A93C" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Tick 6 (Minor White) -->
  <line x1="16.5" y1="16.5" x2="18.5" y2="14.5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Tick 7 (Medium White) -->
  <line x1="18.5" y1="18.5" x2="21" y2="16" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <!-- Tick 8 (Minor White) -->
  <line x1="20.5" y1="20.5" x2="22.5" y2="18.5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Precision Origin Dot at Hotspot (2, 2) -->
  <circle cx="2.5" cy="2.5" r="1.2" fill="#E5A93C" stroke="#FFFFFF" stroke-width="0.6"/>
</svg>